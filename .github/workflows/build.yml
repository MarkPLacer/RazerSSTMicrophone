name: Source tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit public source
        run: python3 tools/audit-source.py
      - name: Fetch pinned build inputs
        run: python3 tools/fetch-dependencies.py
      - name: Test protocol and PCM
        run: ./Test.command
      - name: Build without installing
        run: ./Build.command
